<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Receipt Approval System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {# HTMX is loaded from a CDN, so the browser needs internet access for HTMX features to work.
     The version is pinned to 2.0.11 here and nowhere else. Stay on 2.x: 4.x changes attribute
     inheritance and event names. #}
  <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"></script>
</head>
<body>
  <header>
    <h1>Receipt Approval System</h1>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
