# Alembic settings. Run alembic commands from the repo root, the folder containing this file.
# The database URL is deliberately not set here: alembic/env.py reads it from app.config (DATABASE_URL).

[alembic]
# Where the migration scripts live, relative to this file.
script_location = alembic
# Put the repo root on the import path so env.py can import the app package.
prepend_sys_path = .
# How multiple paths in the setting above would be separated (silences a deprecation warning).
path_separator = os

# Logging so "alembic upgrade head" prints which migrations it runs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
